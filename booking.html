<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Consultation - LexIcon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <style>
        .service-tab {
            padding: .75rem 1.5rem;
            background: rgba(51, 65, 85, .5);
            border: 1px solid rgba(148, 163, 184, .3);
            border-radius: .5rem;
            color: rgba(226, 232, 240, .8);
            font-weight: 600;
            font-size: .875rem;
            cursor: pointer;
            transition: all .3s;
            white-space: nowrap
        }

        .service-tab:hover {
            background: rgba(79, 70, 229, .2);
            border-color: rgba(79, 70, 229, .5);
            color: #3730a3
        }

        .service-tab.active {
            background: linear-gradient(135deg, #3730a3 0%, #312e81 100%);
            border-color: #3730a3;
            color: #fff
        }

        .service-panel {
            display: none
        }

        .service-panel.active {
            display: block
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-900 via-indigo-800 to-slate-900 min-h-screen">
    <nav
        class="navbar fixed w-full top-0 z-50 bg-gradient-to-r from-slate-900 via-indigo-800 to-slate-900 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl md:text-3xl font-bold flex items-center space-x-2 group">
                        <i class="fas fa-balance-scale text-indigo-400 group-hover:rotate-12 transition-transform"></i>
                        <span class="gradient-text"
                            style="background:linear-gradient(135deg,#4f46e5 0%,#6366f1 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">LexIcon</span>
                    </a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html"
                        class="text-white hover:text-indigo-400 transition-all uppercase tracking-wide text-sm font-semibold">Home</a>
                    <a href="about.html"
                        class="text-white hover:text-indigo-400 transition-all uppercase tracking-wide text-sm font-semibold">About</a>
                    <a href="services.html"
                        class="text-white hover:text-indigo-400 transition-all uppercase tracking-wide text-sm font-semibold">Services</a>
                    <a href="team.html"
                        class="text-white hover:text-indigo-400 transition-all uppercase tracking-wide text-sm font-semibold">Team</a>
                    <a href="contact.html"
                        class="text-white hover:text-indigo-400 transition-all uppercase tracking-wide text-sm font-semibold">Contact</a>
                </div>
                <div class="hidden md:flex items-center space-x-4">
                    <a href="login.html" class="text-white hover:text-indigo-400 transition-all"><i
                            class="fas fa-user text-xl"></i></a>
                    <button id="language-toggle" class="text-white hover:text-indigo-400 transition-all"><i
                            class="fas fa-globe text-xl"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <section class="pt-32 pb-20 px-6">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-12">
                <h1 class="text-5xl md:text-6xl font-black text-white mb-4 uppercase"
                    style="font-family:'Plus Jakarta Sans',sans-serif;">
                    Book Your <span class="text-indigo-600">Consultation</span>
                </h1>
                <p class="text-xl text-slate-300">Schedule a strategic session with our elite legal team</p>
            </div>

            <div class="bg-slate-800/50 backdrop-blur-lg rounded-xl p-8 md:p-12 border border-slate-700">
                <div class="flex overflow-x-auto gap-2 mb-8 pb-4 border-b border-slate-700">
                    <button class="service-tab active" data-service="mergers-acquisitions"><i
                            class="fas fa-handshake mr-2"></i>M&A</button>
                    <button class="service-tab" data-service="white-collar"><i class="fas fa-shield-alt mr-2"></i>White
                        Collar</button>
                    <button class="service-tab" data-service="intellectual-property"><i
                            class="fas fa-lightbulb mr-2"></i>IP Law</button>
                    <button class="service-tab" data-service="corporate-litigation"><i
                            class="fas fa-gavel mr-2"></i>Litigation</button>
                    <button class="service-tab" data-service="real-estate"><i class="fas fa-building mr-2"></i>Real
                        Estate</button>
                    <button class="service-tab" data-service="employment"><i
                            class="fas fa-users mr-2"></i>Employment</button>
                    <button class="service-tab" data-service="general"><i
                            class="fas fa-briefcase mr-2"></i>General</button>
                </div>

                <div id="service-panels"></div>
            </div>

            <div class="grid md:grid-cols-3 gap-6 mt-12">
                <div class="bg-slate-800/30 backdrop-blur-lg rounded-xl p-6 border border-slate-700 text-center">
                    <i class="fas fa-clock text-4xl text-indigo-600 mb-3"></i>
                    <h4 class="text-white font-bold mb-2">24/7 Availability</h4>
                    <p class="text-slate-400 text-sm">Emergency consultations available</p>
                </div>
                <div class="bg-slate-800/30 backdrop-blur-lg rounded-xl p-6 border border-slate-700 text-center">
                    <i class="fas fa-lock text-4xl text-indigo-600 mb-3"></i>
                    <h4 class="text-white font-bold mb-2">Confidential</h4>
                    <p class="text-slate-400 text-sm">All communications protected</p>
                </div>
                <div class="bg-slate-800/30 backdrop-blur-lg rounded-xl p-6 border border-slate-700 text-center">
                    <i class="fas fa-award text-4xl text-indigo-600 mb-3"></i>
                    <h4 class="text-white font-bold mb-2">Expert Team</h4>
                    <p class="text-slate-400 text-sm">40+ elite attorneys ready</p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/rtl-toggle.js"></script>
    <script>
        const services = {
            "mergers-acquisitions": { title: "Mergers & Acquisitions", desc: "Strategic guidance for complex cross-border transactions", fee: 2500, duration: "2-hour", label: "Transaction Details" },
            "white-collar": { title: "White Collar Defense", desc: "Confidential representation for regulatory investigations", fee: 3000, duration: "2-hour", label: "Matter Description (Confidential)" },
            "intellectual-property": { title: "Intellectual Property Law", desc: "Patent, trademark, copyright protection and IP litigation", fee: 1800, duration: "90-minute", label: "IP Matter Description" },
            "corporate-litigation": { title: "Corporate Litigation", desc: "High-stakes commercial disputes and business litigation", fee: 2200, duration: "2-hour", label: "Case Description" },
            "real-estate": { title: "Real Estate Law", desc: "Commercial real estate transactions and property development", fee: 1500, duration: "90-minute", label: "Project Description" },
            "employment": { title: "Employment Law", desc: "Workplace disputes, executive contracts, and labor compliance", fee: 1200, duration: "60-minute", label: "Employment Matter Description" },
            "general": { title: "General Legal Consultation", desc: "Initial consultation for matters not listed above", fee: 1000, duration: "60-minute", label: "Matter Description" }
        };

        function createPanel(key, data) {
            return `<div class="service-panel ${key === 'mergers-acquisitions' ? 'active' : ''}" data-panel="${key}">
<div class="mb-8 p-6 bg-indigo-600/10 border border-indigo-600/30 rounded-xl">
<h3 class="text-2xl font-bold text-white mb-2">${data.title}</h3>
<p class="text-slate-300 mb-4">${data.desc}</p>
<div class="flex items-center justify-between">
<span class="text-indigo-600 font-bold text-lg">Consultation Fee: $${data.fee.toLocaleString()}</span>
<span class="text-slate-400 text-sm">Initial ${data.duration} session</span>
</div>
</div>
<form class="booking-form space-y-6">
<input type="hidden" name="service" value="${key}">
<input type="hidden" name="fee" value="${data.fee}">
<div class="grid md:grid-cols-2 gap-4">
<div><label class="block text-slate-300 mb-2 font-semibold">Full Name *</label>
<input type="text" name="name" required placeholder="John Doe" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:border-indigo-600 focus:outline-none"></div>
<div><label class="block text-slate-300 mb-2 font-semibold">Email *</label>
<input type="email" name="email" required placeholder="john@example.com" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:border-indigo-600 focus:outline-none"></div>
<div><label class="block text-slate-300 mb-2 font-semibold">Phone *</label>
<input type="tel" name="phone" required placeholder="+1 (555) 123-4567" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:border-indigo-600 focus:outline-none"></div>
<div><label class="block text-slate-300 mb-2 font-semibold">Company</label>
<input type="text" name="company" placeholder="Company Name" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:border-indigo-600 focus:outline-none"></div>
</div>
<div><label class="block text-slate-300 mb-2 font-semibold">${data.label} *</label>
<textarea name="description" required rows="4" placeholder="Describe your legal matter..." class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:border-indigo-600 focus:outline-none resize-none"></textarea></div>
<div class="grid md:grid-cols-2 gap-4">
<div><label class="block text-slate-300 mb-2 font-semibold">Preferred Date *</label>
<input type="date" name="date" required class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-white focus:border-indigo-600 focus:outline-none"></div>
<div><label class="block text-slate-300 mb-2 font-semibold">Preferred Time *</label>
<select name="time" required class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-white focus:border-indigo-600 focus:outline-none">
<option value="">Select time</option>
<option value="09:00">9:00 AM</option>
<option value="10:00">10:00 AM</option>
<option value="11:00">11:00 AM</option>
<option value="13:00">1:00 PM</option>
<option value="14:00">2:00 PM</option>
<option value="15:00">3:00 PM</option>
<option value="16:00">4:00 PM</option>
</select></div>
</div>
<button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 text-white px-8 py-4 rounded-xl font-bold uppercase tracking-wide hover:from-indigo-700 hover:to-indigo-800 transition-all">
<i class="fas fa-calendar-check mr-2"></i>Confirm Booking - $${data.fee.toLocaleString()}
</button>
</form>
</div>`;
        }

        document.addEventListener('DOMContentLoaded', function () {
            window.alignmentManager = new AlignmentManager();
            const container = document.getElementById('service-panels');
            Object.keys(services).forEach(key => container.innerHTML += createPanel(key, services[key]));

            const tabs = document.querySelectorAll('.service-tab');
            const panels = document.querySelectorAll('.service-panel');
            tabs.forEach(tab => tab.addEventListener('click', function () {
                const service = this.getAttribute('data-service');
                tabs.forEach(t => t.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                document.querySelector(`[data-panel="${service}"]`).classList.add('active');
            }));

            const urlParams = new URLSearchParams(window.location.search);
            const serviceParam = urlParams.get('service');
            if (serviceParam) {
                tabs.forEach(t => t.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));
                const activeTab = document.querySelector(`[data-service="${serviceParam}"]`);
                const activePanel = document.querySelector(`[data-panel="${serviceParam}"]`);
                if (activeTab && activePanel) {
                    activeTab.classList.add('active');
                    activePanel.classList.add('active');
                }
            }

            document.querySelectorAll('.booking-form').forEach(form => form.addEventListener('submit', function (e) {
                e.preventDefault();
                const fee = this.querySelector('[name="fee"]').value;
                const notif = document.createElement('div');
                notif.className = 'fixed top-24 right-6 bg-green-600 text-white px-6 py-4 rounded-xl shadow-xl z-50';
                notif.innerHTML = `<i class="fas fa-check-circle mr-2"></i>Booking confirmed! Fee: $${parseInt(fee).toLocaleString()}. We'll contact you shortly.`;
                document.body.appendChild(notif);
                setTimeout(() => { notif.style.opacity = '0'; notif.style.transition = 'opacity 0.3s'; setTimeout(() => notif.remove(), 300) }, 5000);
                this.reset();
            }));
        });
    </script>
</body>

</html>
