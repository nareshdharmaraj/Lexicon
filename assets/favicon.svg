<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg-grad)"/>
  <!-- Scales of Justice -->
  <g fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center pole -->
    <line x1="16" y1="8" x2="16" y2="24"/>
    <!-- Top beam -->
    <line x1="8" y1="10" x2="24" y2="10"/>
    <!-- Left chain -->
    <line x1="8" y1="10" x2="8" y2="16"/>
    <!-- Right chain -->
    <line x1="24" y1="10" x2="24" y2="16"/>
    <!-- Left pan -->
    <path d="M4 16 Q8 20 12 16" fill="#818cf8"/>
    <!-- Right pan -->
    <path d="M20 16 Q24 20 28 16" fill="#818cf8"/>
    <!-- Base -->
    <line x1="12" y1="24" x2="20" y2="24"/>
  </g>
</svg>
